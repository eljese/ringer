# Sample config for ringer.py.
# Copy to ~/.config/ringer/config.toml or pass with --config /path/to/config.toml.

# Default identity stamped into state JSON and eval rows. Resolution order:
# --identity flag > FLEET_IDENTITY / RINGER_IDENTITY env > a .fleet-agent file
# found walking up from the working directory (per-repo agent name) > this
# value > short hostname.
# identity_default = "codex-mini"

# State files live under <state_dir>/runs/<run_id>.json.
state_dir = "~/.ringer"

# First localhost port tried for the per-run dashboard. The server will scan the
# next 49 ports if this one is busy.
dashboard_port_base = 8787

# Optional native HUD app path. Public installs should omit this and let the
# dashboard open in the browser.
# hud_app_path = "/Applications/Ringside.app"

# Belt-and-suspenders full-access gate. A task with "full_access": true will
# still fail unless this is true.
allow_full_access = false

[update]
# Check origin/main before command dispatch and let a long-running HUD check
# again on this interval. Updates apply only as a clean ff-only move on main.
# Set auto=false to disable both automatic paths; `./ringer.py self-update`
# remains available as an explicit check.
# auto = true
# check_interval_s = 3600
# For one command, pass --no-self-update. To disable automatic checks in an
# environment or service, set RINGER_NO_SELF_UPDATE=1.

# Optional model steering. The directory must contain profiles/ with one
# Markdown profile per model. Ringer creates observations/ringer/ beneath this
# directory automatically as attempts finish.
# [steering]
# dir = "~/.ringer/steering"
# inject_candidates = true

[eval]
# Safe public default: write one JSON object per attempt to a local JSONL file.
# Use "postgres" only when [eval.postgres] is configured.
backend = "jsonl"
jsonl_path = "~/.ringer/runs.jsonl"

# Optional Supabase/Postgres logging. The env file should define:
# SUPABASE_DB_HOST, SUPABASE_DB_PORT, SUPABASE_DB_USER,
# SUPABASE_DB_PASSWORD, SUPABASE_DB_NAME.
# [eval.postgres]
# env_file = "~/.supabase.env"

[engines.codex]
# Public default resolves this with shutil.which("codex"). Set an absolute path
# here only for machine-specific installs.
bin = "codex"
model_default = "gpt-5.6-luna"

# Placeholders:
# - {taskdir}: task working directory
# - {spec}: task prompt/spec
# - {access_args}: expands to sandbox_args or full_access_args
# - {model_args}: expands to "-m <model>" only when the manifest task sets
#   "model" or this engine sets model_default; otherwise it expands to nothing,
#   preserving Codex's configured default. Setting model_default = "gpt-5.6-luna"
#   pins the model instead of inheriting ~/.codex/config.toml drift and makes
#   scoreboard attribution exact.
# - {engine_args}: expands to the task's optional "engine_args" list — the orchestrator
#   sets per-task flags here, e.g. ["-c", "model_reasoning_effort=medium"] to match
#   reasoning depth to task difficulty instead of inheriting the CLI-wide default
args_template = [
  "exec",
  "--skip-git-repo-check",
  "{access_args}",
  "{model_args}",
  "{engine_args}",
  "-C",
  "{taskdir}",
  "{spec}",
]

# Never rely on an engine's default sandbox. Be explicit.
sandbox_args = ["--sandbox", "workspace-write"]
full_access_args = ["--dangerously-bypass-approvals-and-sandbox"]

# First capture group should be the integer token count.
token_regex = "tokens\\s+used\\s*:?\\s*([0-9][0-9,]*)"

# First capture group should be the model slug self-reported by the harness.
# Ringer applies this to captured worker output after every attempt. The Codex
# default reads the `model:` header; override it here only if that format changes.
model_report_regex = "(?m)^model:[ \\t]*([^ \\t\\r\\n]+)[ \\t]*\\r?$"

# Grok Build CLI (xAI). Install: curl -fsSL https://x.ai/cli/install.sh | bash
# (or: npm install -g @xai-official/grok), then `grok login` — OAuth on a
# SuperGrok or X Premium Plus plan. Headless mode (-p) runs a full agentic
# loop with tools and exits. Grok brings its own OS sandbox (Seatbelt on
# macOS): profile "workspace" = read everywhere, write CWD + temp + ~/.grok,
# network allowed. Models: grok-build, grok-composer-2.5-fast (route with the
# per-task "model" field). Verified against Grok Build v0.2.81 (2026-07-06).
# Note: --no-auto-update is accepted but absent from --help in v0.2.81 (grok
# rejects unknown flags, so this is a hidden flag, not a typo) — it stops the
# CLI self-updating mid-swarm.
# Uncomment to enable.
# [engines.grok]
# bin = "grok"
# model_default = "grok-composer-2.5-fast"
# args_template = [
#   "--cwd",
#   "{taskdir}",
#   "{access_args}",
#   "-m",
#   "{model}",
#   "--always-approve",
#   "--no-auto-update",
#   "--output-format",
#   "json",
#   "{engine_args}",
#   "-p",
#   "{spec}",
# ]
# sandbox_args = ["--sandbox", "workspace"]
# full_access_args = ["--sandbox", "off", "--permission-mode", "bypassPermissions"]
# Grok's JSON output carries no usage/token fields (verified v0.2.81) — plan
# CLIs report cost as "included in plan"; regex is a harmless no-match. Its JSON
# also does not self-report a model, so no model_report_regex is configured.
# token_regex = "\"total_tokens\"\\s*:\\s*([0-9]+)"

# Antigravity CLI (`agy`) — Google Antigravity headless CLI. Install with
# `agy` once available on your PATH, then run `agy` interactively to
# authenticate. Verified against agy 1.1.9 (2026-08-02) on Linux.
# Ringer closes stdin, so only `-p` / `--print` headless mode is suitable.
# Verified agy -p exits cleanly with stdin closed.
# `agy models` lists the available model keys; default below uses
# "gemini-3.6-flash-high". Override per-task via the manifest "model"
# field, or set model_default to another verified key.
#
# **Sandbox is the default and the only safe option.** `agy` is wired
# so the literal `--sandbox` flag always appears in args_template, and
# `sandbox_args = []` (no extras) — every default task runs sandboxed.
# Full access (`full_access_args = ["--dangerously-skip-permissions"]`)
# only takes effect when a task explicitly sets `"full_access": true`
# AND the config has `allow_full_access = true`. Without that opt-in,
# the bypass is impossible regardless of what the worker prompt says.
# This matches the same belt-and-suspenders model the codex block uses.
# Use `--add-dir {taskdir}` (NOT `--project {taskdir}`). `--project` is a
# project-ID token in agy 1.1.9 and does NOT pin filesystem writes; the
# file lands in ~/.gemini/antigravity-cli/scratch/ regardless. `--add-dir`
# scopes agy's write tools to {taskdir} and is the documented recipe.
# Verified 2026-07-09 on Linux: a one-task `agy --add-dir $taskdir -p '...'
# write to current working directory'` puts the file at $taskdir/...
# with no scratch leakage.
#
# If `--add-dir` does not exist or behaves differently on your installed
# version (regression test on a new agy release), point `bin` at
# engines/agy-ringer.sh instead and drop "--add-dir" / "--project" from
# args_template. The wrapper is a belt-and-suspenders fallback that
# mirrors scratch → {taskdir} after agy exits. See docs/AGY.md "Engine
# wrapper" for the contract and concurrent-run warning.
# Uncomment to enable.
# [engines.agy]
# bin = "agy"
# model_default = "gemini-3.6-flash-high"
# args_template = [
#   "--add-dir",            # scopes writes to {taskdir}; not "--project"
#   "{taskdir}",
#   "--model",
#   "{model}",
#   "--mode",
#   "accept-edits",
#   "--sandbox",
#   "{access_args}",
#   "{engine_args}",
#   "-p",
#   "{spec}",
# ]
# sandbox_args = []
# full_access_args = ["--dangerously-skip-permissions"]
# Token output format for agy 1.1.9 not yet verified — leave disabled.
# token_regex = ""

# Claude Code (Anthropic) — Anthropic's official headless CLI.
# Install: `npm install -g @anthropic-ai/claude-code` (or the
# official installer at https://claude.com/install), then run `claude`
# interactively to authenticate.
# Verified against claude 2.1.179 (2026-07-09) on Linux.
# See docs/CLAUDE-CODE-PROBE-RESULTS.md for the live evidence behind
# each flag below.
#
# Notes from the probe pass:
#  --add-dir (Q2): allow-list for tool paths, NOT a write pin. Writes
#       resolve against cwd. Combined with Ringer setting cwd = taskdir,
#       this is sufficient — no extra `cd $taskdir` injection needed.
#  --permission-mode acceptEdits (Q3): honoured in --bare mode. But
#       without an --allowedTools whitelist the agent still hangs on
#       interactive permission prompts. The whitelist below is REQUIRED
#       for unattended -p runs. Bash is included as a Write fallback
#       because Q3 observed partial --allowedTools honoring on this
#       CLI build.
#  --bare (Q3): still pins --add-dir / --permission-mode. Skips
#       CLAUDE.md auto-discovery, plugin sync, hook scripts,
#       attribution, and auto-memory. Useful for swarm runs where
#       deterministic stderr beats personalization.
#  --output-format json (Q4): top-level shape carries
#       usage.output_tokens (snake_case) and modelUsage.*.outputTokens
#       (camelCase). token_regex below targets the snake_case key.
# Uncomment to enable.
# [engines.claude]
# bin = "claude"
# Q1: claude-sonnet-4-6 is the current-gen Sonnet and was accepted on
#     every probe run. claude-sonnet-4-5, claude-opus-4-7/4-8, and
#     claude-haiku-4-5 are also accepted; pin per task via manifest.
# model_default = "claude-sonnet-4-6"
# args_template = [
#   "--bare",
#   "--add-dir",
#   "{taskdir}",
#   "--model",
#   "{model}",
#   "{access_args}",
#   "{engine_args}",
#   "--output-format",
#   "json",
#   "-p",
#   "{spec}",
# ]
# Q2/Q3: --allowedTools whitelist is REQUIRED — without it the agent
#         hits interactive permission prompts and hangs. The whitelist
#         mirrors the codex workspace-write spirit (read/edit/grep/glob
#         plus write). Bash is kept as a Write fallback because Q3
#         observed that --allowedTools honoring is partial on this
#         build; for tighter containment, document the alternative:
#         swap to --dangerously-skip-permissions (full_access_args).
# sandbox_args = [
#   "--permission-mode", "acceptEdits",
#   "--allowedTools", "Read Edit Write Glob Grep Bash",
# ]
# full_access_args = ["--dangerously-skip-permissions"]
# Q4: regex source (Python r-string form):  "output_tokens"\s*:\s*([0-9]+)
#     TOML string below compiles to that source. Captures the integer
#     `output_tokens` count from a `--output-format json` response.
# token_regex = "\"output_tokens\"\\s*:\\s*([0-9]+)"

# For CI, acceptance evals, and trying Ringer without an API bill.
# [engines.mock]
# bin = "python3"
# args_template = [
#   "/absolute/path/to/ringer/engines/mock_worker.py",
#   "{spec}",
# ]
# sandbox_args = []
# full_access_args = []

# OpenCode — the universal model harness. One engine block runs provider models:
# the {model} placeholder is filled per task from
# the manifest's "model" field, falling back to model_default below. Example
# OpenCode has no OS sandbox, so `bin` points at the cross-platform Ringer
# wrapper. It uses Seatbelt on macOS and bubblewrap on Linux. Auth is managed
# by OpenCode in ~/.local/share/opencode/auth.json; confirm providers with
# `opencode auth list`.
# Per-task engine_args can set reasoning effort ("--variant", "low|high|max").
# Uncomment and set an absolute path for `bin` to enable.
# [engines.opencode]
# bin = "/absolute/path/to/ringer/engines/opencode-sandboxed.sh"
# model_default = "minimax-coding-plan/MiniMax-M3"
# args_template = [
#   "{taskdir}",
#   "{access_args}",
#   "run",
#   "--model",
#   "{model}",
#   "--format",
#   "json",
#   "--dir",
#   "{taskdir}",
#   "--auto",
#   "{engine_args}",
#   "{spec}",
# ]
# sandbox_args = []
# full_access_args = ["--no-sandbox"]
# token_regex = '"tokens"\s*:\s*\{\s*"total"\s*:\s*([0-9]+)'

[artifact]
# Zero-LLM, self-contained HTML artifacts rendered directly from state — no model calls, no
# network. Three files per config, all pure stdlib templates:
#   - `out`: the live status page, re-rendered on every ~1s state flush while a run is in
#     progress (meta-refresh, no JS needed). Ringside can embed or open this.
#   - `report_out`: the final report, rendered once when a run finishes — full task table,
#     timings, attempts/retries, check output, links to each task's worker.log/report files.
#   - `index_out`: a single multi-run index listing every run under state_dir (handy when
#     several swarms run at once).
# Templates support {run_id} and {run_name} substitution. Disable with --no-artifact.
enabled = true
out = "~/.ringer/artifacts/{run_id}.html"
report_out = "~/.ringer/artifacts/{run_id}-report.html"
index_out = "~/.ringer/artifacts/index.html"
